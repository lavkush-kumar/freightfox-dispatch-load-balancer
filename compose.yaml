services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dispatchdb
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatchdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dispatchdb
      DB_USERNAME: dispatch
      DB_PASSWORD: dispatch
    ports:
      - "8080:8080"
volumes:
  postgres_data:
